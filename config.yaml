# Signal Bot settings. Edit freely; no code changes needed.

# Stocks the bot makes calls on.
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AMD
  - JPM
  - XOM

# Market context: the whole market, volatility, and sectors.
# These get price history only (no news).
context:
  - SPY      # S&P 500
  - QQQ      # Nasdaq 100
  - ^VIX     # volatility index (Yahoo symbol)
  - XLK      # tech
  - XLF      # financials
  - XLE      # energy
  - XLY      # consumer discretionary
  - XLC      # communication services
  - ^TNX     # 10-year Treasury yield
  - ^IRX     # 3-month Treasury bill yield

# Which sector ETF each watchlist stock is compared against.
# Any stock not listed here is compared against SPY.
sectors:
  AAPL: XLK
  MSFT: XLK
  NVDA: XLK
  AMD: XLK
  AMZN: XLY
  TSLA: XLY
  GOOGL: XLC
  META: XLC
  JPM: XLF
  XOM: XLE

# How far back to pull price history on the first run.
history_start: "2019-01-01"

# How far back to pull news on the first run (free news tiers limit history).
news_lookback_days: 365

# News published after this time (US Eastern) counts toward the NEXT trading day,
# so the model never sees news that came out after the close it's predicting from.
market_timezone: "America/New_York"
news_cutoff: "16:00"

# Where the local database lives (ignored by git).
database_path: "data/signalbot.db"

# ---------------------------------------------------------------- Trench (intraday)
# Settings for 1-5 minute calls, matched to how Trench trades.
trench:
  multiplier: 25        # the multiplier you usually use (results are shown at this)
  fee_bps: null         # Trench's fee per trade, as basis points of the position (1 bp = 0.01%).
                        # Read it off a real ticket: fee $ / (stake $ x multiplier) x 10000.
                        # Leave null until you know it; the bot then shows the max fee each call survives.
  entry_delay_min: 1    # minutes between the alert and you placing the trade
  holds: [1, 2, 3, 5]   # hold times (minutes) the bot chooses between
  history_days: 120     # how much minute history to learn from
  feed: iex             # Alpaca's free real-time stock feed
  markets:
    stocks: [AAPL, MSFT, NVDA, AMZN, META, TSLA]
    crypto: [BTC/USD, ETH/USD, SOL/USD]
    commodities:        # ETFs that track the commodity; US market hours only
      GLD: gold
      SLV: silver
      USO: oil
  context: [SPY, QQQ]   # market mood for stocks and commodities (BTC/USD is used for crypto)
